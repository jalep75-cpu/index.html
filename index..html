p<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#080806">
<title>Black Music DNA</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:root{--black:#080806;--cream:#F2EDD7;--gold:#C9A84C;--gold-dim:rgba(201,168,76,0.15);--red:#8B1A1A;--surface:rgba(242,237,215,0.04);--border:rgba(201,168,76,0.18);--text-dim:rgba(242,237,215,0.45);--radius:10px;}
html,body{height:100%;overflow:hidden;}
body{background:var(--black);color:var(--cream);font-family:'DM Sans',sans-serif;display:flex;flex-direction:column;height:100dvh;overscroll-behavior:none;}

/* HEADER */
.app-header{flex-shrink:0;padding:14px 20px;background:rgba(8,8,6,0.95);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;}
.vinyl-spin{width:38px;height:38px;border-radius:50%;flex-shrink:0;background:conic-gradient(from 0deg,#1a1a18 0deg,#252523 25deg,#1a1a18 50deg,#252523 75deg,#1a1a18 100deg,#252523 125deg,#1a1a18 150deg,#252523 175deg,#1a1a18 200deg,#252523 225deg,#1a1a18 250deg,#252523 275deg,#1a1a18 300deg,#252523 325deg,#1a1a18 350deg,#252523 360deg);display:flex;align-items:center;justify-content:center;border:1.5px solid rgba(201,168,76,0.4);animation:spin 6s linear infinite;}
.vinyl-spin.paused{animation-play-state:paused;}
.vinyl-spin::after{content:'';width:10px;height:10px;border-radius:50%;background:var(--gold);}
@keyframes spin{to{transform:rotate(360deg);}}
.header-title{font-family:'Bebas Neue',cursive;font-size:1.5rem;letter-spacing:0.05em;color:var(--cream);line-height:1;}
.header-sub{font-family:'Space Mono',monospace;font-size:0.5rem;color:var(--gold);text-transform:uppercase;letter-spacing:0.18em;margin-top:2px;}

/* API KEY BANNER */
.api-banner{flex-shrink:0;padding:10px 20px;background:rgba(201,168,76,0.08);border-bottom:1px solid var(--border);display:flex;gap:8px;align-items:center;}
.api-input{flex:1;background:rgba(0,0,0,0.3);border:1px solid var(--border);border-radius:6px;padding:8px 12px;color:var(--cream);font-family:'Space Mono',monospace;font-size:0.7rem;outline:none;}
.api-input:focus{border-color:var(--gold);}
.api-save{background:var(--gold);border:none;border-radius:6px;padding:8px 14px;color:var(--black);font-family:'Bebas Neue',cursive;font-size:0.9rem;letter-spacing:0.06em;cursor:pointer;white-space:nowrap;flex-shrink:0;}
.api-ok{font-family:'Space Mono',monospace;font-size:0.6rem;color:#1D9E75;letter-spacing:0.1em;display:none;}

/* GENRE TABS */
.genre-scroll{flex-shrink:0;display:flex;gap:8px;padding:10px 20px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;border-bottom:1px solid var(--border);}
.genre-scroll::-webkit-scrollbar{display:none;}
.genre-btn{flex-shrink:0;font-family:'Space Mono',monospace;font-size:0.58rem;text-transform:uppercase;letter-spacing:0.1em;padding:6px 14px;border-radius:20px;border:1px solid rgba(242,237,215,0.15);color:var(--text-dim);background:transparent;cursor:pointer;transition:all 0.18s;white-space:nowrap;}
.genre-btn.active{border-color:var(--gold);color:var(--gold);background:var(--gold-dim);}

/* SEARCH */
.search-wrap{flex-shrink:0;padding:12px 20px;display:flex;gap:10px;align-items:center;}
.search-input{flex:1;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px 16px;color:var(--cream);font-family:'DM Sans',sans-serif;font-size:0.95rem;outline:none;transition:border-color 0.2s;-webkit-appearance:none;}
.search-input::placeholder{color:var(--text-dim);font-style:italic;}
.search-input:focus{border-color:var(--gold);}
.search-go{background:var(--gold);border:none;border-radius:var(--radius);padding:12px 18px;color:var(--black);font-family:'Bebas Neue',cursive;font-size:1.05rem;letter-spacing:0.06em;cursor:pointer;transition:all 0.15s;flex-shrink:0;}
.search-go:active{transform:scale(0.96);}
.search-go:disabled{opacity:0.4;}

/* MAIN */
.main-scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;padding-bottom:80px;}

/* EMPTY */
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:3rem 2rem;gap:1rem;min-height:55vh;text-align:center;}
.empty-vinyl{width:70px;height:70px;border-radius:50%;background:conic-gradient(from 0deg,#1a1a18 0deg,#252523 30deg,#1a1a18 60deg,#252523 90deg,#1a1a18 120deg,#252523 150deg,#1a1a18 180deg,#252523 210deg,#1a1a18 240deg,#252523 270deg,#1a1a18 300deg,#252523 330deg,#1a1a18 360deg);display:flex;align-items:center;justify-content:center;opacity:0.15;border:2px solid rgba(201,168,76,0.2);}
.empty-vinyl::after{content:'';width:16px;height:16px;border-radius:50%;background:rgba(201,168,76,0.3);}
.empty-title{font-family:'Bebas Neue',cursive;font-size:1.5rem;letter-spacing:0.04em;color:rgba(242,237,215,0.2);}
.empty-sub{font-family:'Space Mono',monospace;font-size:0.58rem;color:rgba(242,237,215,0.15);letter-spacing:0.1em;text-transform:uppercase;}
.suggestions{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:0.5rem;}
.sug-btn{background:var(--surface);border:1px solid rgba(242,237,215,0.1);color:rgba(242,237,215,0.35);font-family:'Space Mono',monospace;font-size:0.6rem;text-transform:uppercase;letter-spacing:0.06em;padding:7px 14px;border-radius:20px;cursor:pointer;transition:all 0.15s;}
.sug-btn:active{border-color:var(--gold);color:var(--gold);}

/* LOADING */
.loading{display:none;flex-direction:column;align-items:center;justify-content:center;gap:1.5rem;padding:4rem 2rem;min-height:50vh;}
.loading.show{display:flex;}
.loading-vinyl{width:64px;height:64px;border-radius:50%;background:conic-gradient(from 0deg,#1a1a18 0deg,#2a2a28 30deg,#1a1a18 60deg,#2a2a28 90deg,#1a1a18 120deg,#2a2a28 150deg,#1a1a18 180deg,#2a2a28 210deg,#1a1a18 240deg,#2a2a28 270deg,#1a1a18 300deg,#2a2a28 330deg,#1a1a18 360deg);animation:spin 1.8s linear infinite;display:flex;align-items:center;justify-content:center;border:2px solid var(--gold);}
.loading-vinyl::after{content:'';width:14px;height:14px;border-radius:50%;background:var(--gold);}
.loading-msg{font-family:'Space Mono',monospace;font-size:0.65rem;color:var(--gold);text-transform:uppercase;letter-spacing:0.15em;animation:pulse 1.4s ease-in-out infinite;}
@keyframes pulse{0%,100%{opacity:0.3}50%{opacity:1}}

/* ERROR */
.error-bar{display:none;margin:0 20px 10px;padding:10px 14px;background:rgba(139,26,26,0.15);border:1px solid var(--red);border-radius:8px;color:#e74c3c;font-family:'Space Mono',monospace;font-size:0.68rem;}
.error-bar.show{display:block;}

/* ARTIST CARD */
.artist-card{margin:16px 20px;padding:18px;background:var(--surface);border:1px solid var(--border);border-radius:14px;animation:fadeUp 0.4s ease;}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.artist-name{font-family:'Bebas Neue',cursive;font-size:2.2rem;line-height:0.9;letter-spacing:0.03em;}
.artist-genre{display:inline-block;font-family:'Space Mono',monospace;font-size:0.55rem;text-transform:uppercase;letter-spacing:0.12em;padding:3px 10px;border:1px solid var(--gold);color:var(--gold);border-radius:2px;margin:8px 0;}
.artist-bio{font-size:0.82rem;line-height:1.65;color:var(--text-dim);}
.artist-stats{display:flex;gap:16px;margin-top:14px;flex-wrap:wrap;}
.stat{border-left:2px solid var(--gold);padding-left:10px;}
.stat-n{font-family:'Bebas Neue',cursive;font-size:1.5rem;color:var(--gold);line-height:1;}
.stat-l{font-family:'Space Mono',monospace;font-size:0.5rem;text-transform:uppercase;letter-spacing:0.08em;color:rgba(242,237,215,0.3);margin-top:2px;}

/* SECTION */
.section-hd{display:flex;align-items:center;gap:10px;padding:18px 20px 8px;}
.section-hd-label{font-family:'Bebas Neue',cursive;font-size:1rem;letter-spacing:0.1em;color:var(--gold);}
.section-hd-line{flex:1;height:1px;background:var(--border);}
.section-hd-count{font-family:'Space Mono',monospace;font-size:0.55rem;color:var(--text-dim);}

/* TRACK */
.track-card{display:flex;align-items:flex-start;gap:10px;padding:10px 20px;border-bottom:1px solid rgba(242,237,215,0.04);transition:background 0.12s;animation:fadeUp 0.3s ease both;}
.track-card:active{background:rgba(242,237,215,0.03);}
.track-num{font-family:'Space Mono',monospace;font-size:0.65rem;color:rgba(242,237,215,0.2);min-width:22px;text-align:right;padding-top:4px;flex-shrink:0;}
.track-cover{width:40px;height:40px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:1.1rem;flex-shrink:0;}
.track-body{flex:1;min-width:0;}
.track-title{font-size:0.88rem;font-weight:500;color:var(--cream);line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.track-artist{font-size:0.73rem;color:var(--text-dim);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.track-note{font-size:0.65rem;color:var(--gold);font-style:italic;margin-top:3px;opacity:0.75;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.track-right{flex-shrink:0;text-align:right;}
.track-year{font-family:'Space Mono',monospace;font-size:0.6rem;color:rgba(242,237,215,0.25);}
.track-badge{font-size:0.52rem;padding:2px 6px;border-radius:3px;margin-top:4px;display:inline-block;font-family:'Space Mono',monospace;text-transform:uppercase;letter-spacing:0.04em;}

/* EXPORT */
.export-wrap{margin:16px 20px;border:1px solid var(--border);border-radius:14px;overflow:hidden;}
.export-hd{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--surface);border-bottom:1px solid var(--border);}
.export-hd-label{font-family:'Bebas Neue',cursive;font-size:0.9rem;letter-spacing:0.1em;color:var(--gold);}
.copy-btn{background:transparent;border:1px solid var(--gold);color:var(--gold);font-family:'Space Mono',monospace;font-size:0.58rem;text-transform:uppercase;letter-spacing:0.08em;padding:5px 12px;border-radius:4px;cursor:pointer;}
.export-list{padding:12px 16px;max-height:180px;overflow-y:auto;}
.export-line{font-family:'Space Mono',monospace;font-size:0.6rem;color:rgba(242,237,215,0.5);line-height:2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

/* BOTTOM NAV */
.bottom-nav{flex-shrink:0;display:flex;background:rgba(8,8,6,0.95);backdrop-filter:blur(20px);border-top:1px solid var(--border);}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 0;background:transparent;border:none;color:var(--text-dim);cursor:pointer;transition:color 0.15s;}
.nav-btn.active{color:var(--gold);}
.nav-icon{font-size:1.2rem;}
.nav-label{font-family:'Space Mono',monospace;font-size:0.48rem;text-transform:uppercase;letter-spacing:0.08em;}
::-webkit-scrollbar{width:3px;}
::-webkit-scrollbar-thumb{background:rgba(201,168,76,0.25);border-radius:2px;}
</style>
</head>
<body>

<header class="app-header">
  <div class="vinyl-spin" id="vinylSpin"></div>
  <div>
    <div class="header-title">Black Music DNA</div>
    <div class="header-sub">Samples & Origins Generator</div>
  </div>
</header>

<div class="api-banner">
  <input class="api-input" id="apiKeyInput" type="password" placeholder="Colle ta clé Groq ici : gsk_..." />
  <button class="api-save" onclick="saveKey()">Sauver</button>
  <span class="api-ok" id="apiOk">✓ CLÉ OK</span>
</div>

<div class="genre-scroll">
  <button class="genre-btn active" onclick="setGenre(this,'Soul & Funk')">Soul & Funk</button>
  <button class="genre-btn" onclick="setGenre(this,'Hip-Hop')">Hip-Hop</button>
  <button class="genre-btn" onclick="setGenre(this,'Jazz')">Jazz</button>
  <button class="genre-btn" onclick="setGenre(this,'R&B / Neo-Soul')">R&B / Neo-Soul</button>
  <button class="genre-btn" onclick="setGenre(this,'Reggae')">Reggae</button>
  <button class="genre-btn" onclick="setGenre(this,'Afrobeats')">Afrobeats</button>
  <button class="genre-btn" onclick="setGenre(this,'Blues')">Blues</button>
  <button class="genre-btn" onclick="setGenre(this,'Gospel')">Gospel</button>
  <button class="genre-btn" onclick="setGenre(this,'Electronic')">Electronic</button>
</div>

<div class="search-wrap">
  <input class="search-input" id="searchInput" type="text" placeholder="James Brown, Curtis Mayfield, Fela Kuti..." autocomplete="off" autocorrect="off" spellcheck="false"/>
  <button class="search-go" id="searchBtn" onclick="go()">GO</button>
</div>

<div class="error-bar" id="errorBar"></div>

<div class="main-scroll" id="mainScroll">
  <div class="empty" id="emptyState">
    <div class="empty-vinyl"></div>
    <div class="empty-title">Cherche un artiste</div>
    <div class="empty-sub">Entre ta clé Groq puis cherche</div>
    <div class="suggestions">
      <button class="sug-btn" onclick="quick('James Brown')">James Brown</button>
      <button class="sug-btn" onclick="quick('Curtis Mayfield')">Curtis Mayfield</button>
      <button class="sug-btn" onclick="quick('Isaac Hayes')">Isaac Hayes</button>
      <button class="sug-btn" onclick="quick('Marvin Gaye')">Marvin Gaye</button>
      <button class="sug-btn" onclick="quick('Aretha Franklin')">Aretha Franklin</button>
      <button class="sug-btn" onclick="quick('Nina Simone')">Nina Simone</button>
      <button class="sug-btn" onclick="quick('Stevie Wonder')">Stevie Wonder</button>
      <button class="sug-btn" onclick="quick('Fela Kuti')">Fela Kuti</button>
      <button class="sug-btn" onclick="quick('Lyn Collins')">Lyn Collins</button>
      <button class="sug-btn" onclick="quick('DJ Muggs')">DJ Muggs</button>
    </div>
  </div>
  <div class="loading" id="loading">
    <div class="loading-vinyl"></div>
    <div class="loading-msg" id="loadingMsg">Recherche dans les crates...</div>
  </div>
  <div id="results"></div>
</div>

<nav class="bottom-nav">
  <button class="nav-btn active" id="navSearch" onclick="showTab('search')">
    <span class="nav-icon">🔍</span><span class="nav-label">Explorer</span>
  </button>
  <button class="nav-btn" id="navHistory" onclick="showTab('history')">
    <span class="nav-icon">🕐</span><span class="nav-label">Historique</span>
  </button>
  <button class="nav-btn" id="navExport" onclick="showTab('export')">
    <span class="nav-icon">📤</span><span class="nav-label">Export</span>
  </button>
</nav>

<script>
let genre='Soul & Funk';
let lastData=null;
let history=JSON.parse(localStorage.getItem('bmd_h')||'[]');
const MSGS=['Recherche dans les crates...','Identification des samples...','Connexion à Groq...','Construction de la playlist...','Pressage du vinyl...'];
let msgI=0,msgTimer;

// Load saved key
window.addEventListener('load',()=>{
  const k=localStorage.getItem('groq_key');
  if(k){document.getElementById('apiKeyInput').value=k;document.getElementById('apiOk').style.display='inline';}
});

function saveKey(){
  const k=document.getElementById('apiKeyInput').value.trim();
  if(!k){showError('Entre ta clé Groq d\'abord');return;}
  localStorage.setItem('groq_key',k);
  document.getElementById('apiOk').style.display='inline';
  showError('');
}

function setGenre(btn,g){document.querySelectorAll('.genre-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');genre=g;}
function quick(name){document.getElementById('searchInput').value=name;go();}

function setLoading(show){
  const v=document.getElementById('vinylSpin');
  document.getElementById('loading').classList.toggle('show',show);
  if(show){v.classList.remove('paused');msgI=0;document.getElementById('loadingMsg').textContent=MSGS[0];msgTimer=setInterval(()=>{msgI=(msgI+1)%MSGS.length;document.getElementById('loadingMsg').textContent=MSGS[msgI];},1100);}
  else{v.classList.add('paused');clearInterval(msgTimer);}
}

function getBadge(g){
  const m={'hip':['#EEEDFE','#3C3489'],'rap':['#EEEDFE','#3C3489'],'jazz':['#E6F1FB','#0C447C'],'soul':['#FAEEDA','#633806'],'funk':['#FAEEDA','#633806'],'r&b':['#FBEAF0','#72243E'],'neo':['#FBEAF0','#72243E'],'reggae':['#EAF3DE','#27500A'],'afro':['#EAF3DE','#27500A'],'gospel':['#F0EAFB','#3d1c6b'],'blues':['#FFF3CD','#7B5A00'],'electro':['#E6EFF5','#1A3A5C'],'original':['rgba(201,168,76,0.12)','#C9A84C']};
  const k=(g||'').toLowerCase();
  for(const[key,val]of Object.entries(m)){if(k.includes(key))return val;}
  return['rgba(242,237,215,0.07)','rgba(242,237,215,0.5)'];
}
function getCover(g){
  const k=(g||'').toLowerCase();
  if(k.includes('hip')||k.includes('rap'))return['#12122A','🎧'];
  if(k.includes('jazz'))return['#0A1A2E','🎷'];
  if(k.includes('funk')||k.includes('soul')||k.includes('original'))return['#1E1008','🎸'];
  if(k.includes('r&b')||k.includes('neo'))return['#1E0820','✨'];
  if(k.includes('reggae'))return['#081E12','🌿'];
  if(k.includes('afro'))return['#1E1008','🥁'];
  if(k.includes('gospel'))return['#100820','🎹'];
  if(k.includes('blues'))return['#080E1E','🎺'];
  if(k.includes('electro'))return['#08121E','🎛'];
  return['#141412','🎵'];
}

function render(data){
  lastData=data;
  const el=document.getElementById('results');
  el.innerHTML='';
  const ac=document.createElement('div');
  ac.className='artist-card';
  const statsHTML=(data.stats||[{num:data.samples_count||'?',label:'Samples'},{num:data.era||'?',label:'Période'},{num:data.rank||'Top 50',label:'WhoSampled'}]).map(s=>`<div class="stat"><div class="stat-n">${s.num}</div><div class="stat-l">${s.label}</div></div>`).join('');
  ac.innerHTML=`<div class="artist-name">${data.artist||'?'}</div><div class="artist-genre">${data.genre||''}</div><div class="artist-bio">${data.bio||''}</div><div class="artist-stats">${statsHTML}</div>`;
  el.appendChild(ac);
  const exportLines=[`🎵 ${data.artist} — Black Music DNA\n${'═'.repeat(44)}`];
  let num=1;
  (data.sections||[]).forEach(sec=>{
    if(!(sec.tracks||[]).length)return;
    const hd=document.createElement('div');
    hd.className='section-hd';
    hd.innerHTML=`<div class="section-hd-label">${sec.icon||'▶'} ${sec.title}</div><div class="section-hd-line"></div><div class="section-hd-count">${sec.tracks.length} titres</div>`;
    el.appendChild(hd);
    exportLines.push(`\n${sec.icon||'▶'} ${sec.title.toUpperCase()}\n${'─'.repeat(36)}`);
    sec.tracks.forEach((t,i)=>{
      const card=document.createElement('div');
      card.className='track-card';
      card.style.animationDelay=`${i*0.03}s`;
      const[bgCol,emoji]=getCover(t.genre);
      const[bgBadge,colBadge]=getBadge(t.genre);
      card.innerHTML=`<div class="track-num">${num}</div><div class="track-cover" style="background:${bgCol};">${emoji}</div><div class="track-body"><div class="track-title">${t.title||'—'}</div><div class="track-artist">${t.artist||'—'}</div>${t.note?`<div class="track-note">${t.note}</div>`:''}</div><div class="track-right"><div class="track-year">${t.year||''}</div>${t.genre?`<div class="track-badge" style="background:${bgBadge};color:${colBadge};">${t.genre}</div>`:''}</div>`;
      el.appendChild(card);
      exportLines.push(`${num}. ${t.artist} — ${t.title} (${t.year||''})`);
      num++;
    });
  });
  exportLines.push(`\n${'═'.repeat(44)}\n📋 ${data.artist} DNA · ${data.genre||''} · ${data.era||''}`);
  const ew=document.createElement('div');
  ew.className='export-wrap';
  const exportText=exportLines.join('\n');
  ew.innerHTML=`<div class="export-hd"><div class="export-hd-label">// Export Spotify</div><button class="copy-btn" onclick="doCopy(this,\`${exportText.replace(/`/g,'\\`').replace(/\$/g,'\\$')}\`)">Copier</button></div><div class="export-list">${exportLines.map(l=>`<div class="export-line">${l}</div>`).join('')}</div>`;
  el.appendChild(ew);
  document.getElementById('emptyState').style.display='none';
  document.getElementById('mainScroll').scrollTo({top:0,behavior:'smooth'});
}

function doCopy(btn,text){
  navigator.clipboard.writeText(text).then(()=>{btn.textContent='Copié ✓';setTimeout(()=>btn.textContent='Copier',2000);}).catch(()=>{const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);btn.textContent='Copié ✓';setTimeout(()=>btn.textContent='Copier',2000);});
}

function showTab(tab){
  ['navSearch','navHistory','navExport'].forEach(id=>document.getElementById(id).classList.remove('active'));
  if(tab==='search'){document.getElementById('navSearch').classList.add('active');document.getElementById('results').style.display='';document.getElementById('emptyState').style.display=lastData?'none':'';}
  else if(tab==='history'){document.getElementById('navHistory').classList.add('active');showHistory();}
  else if(tab==='export'){document.getElementById('navExport').classList.add('active');if(!lastData){showError('Lance d\'abord une recherche');return;}document.getElementById('mainScroll').scrollTo({top:document.getElementById('mainScroll').scrollHeight,behavior:'smooth'});}
}

function showHistory(){
  const el=document.getElementById('results');
  el.innerHTML='';document.getElementById('emptyState').style.display='none';
  if(!history.length){el.innerHTML='<div class="empty"><div class="empty-vinyl"></div><div class="empty-title">Aucun historique</div></div>';return;}
  const hd=document.createElement('div');hd.className='section-hd';hd.innerHTML=`<div class="section-hd-label">🕐 Recherches</div><div class="section-hd-line"></div><div class="section-hd-count">${history.length}</div>`;el.appendChild(hd);
  history.slice().reverse().forEach(h=>{const c=document.createElement('div');c.className='track-card';c.style.cursor='pointer';c.innerHTML=`<div class="track-num">🎵</div><div class="track-cover" style="background:#1a1a18;">🎤</div><div class="track-body"><div class="track-title">${h.artist}</div><div class="track-artist">${h.genre}</div></div><div class="track-right"><div class="track-year">→</div></div>`;c.onclick=()=>{document.getElementById('searchInput').value=h.artist;showTab('search');go();};el.appendChild(c);});
}

function showError(msg){const el=document.getElementById('errorBar');if(!msg){el.classList.remove('show');return;}el.textContent='// '+msg;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),4000);}

async function go(){
  const artist=document.getElementById('searchInput').value.trim();
  if(!artist){showError('Tape un nom d\'artiste');return;}
  const key=localStorage.getItem('groq_key')||document.getElementById('apiKeyInput').value.trim();
  if(!key){showError('Entre ta clé Groq d\'abord !');return;}

  document.getElementById('searchBtn').disabled=true;
  document.getElementById('emptyState').style.display='none';
  document.getElementById('results').innerHTML='';
  document.getElementById('errorBar').classList.remove('show');
  showTab('search');setLoading(true);

  const prompt=`Tu es un expert en Black Music et samples. Génère une playlist complète pour: "${artist}" dans le genre: "${genre}".
Réponds UNIQUEMENT en JSON valide, sans markdown ni backticks.
{"artist":"Nom","genre":"Genre","era":"1965-1985","samples_count":"+1500","rank":"Top 10","bio":"2-3 phrases.","stats":[{"num":"chiffre","label":"label"},{"num":"chiffre","label":"label"},{"num":"chiffre","label":"label"}],"sections":[{"title":"Les Originaux","icon":"🌱","tracks":[{"title":"Titre","artist":"Artiste","year":"1972","genre":"Funk Soul","note":"Note courte"}]}]}
Sections: 1."🌱 Les Originaux" 8-12 titres, 2."🎧 Hip-Hop" 10-14 titres, 3."💜 R&B & Neo-Soul" 6-8 titres, 4."🎛 Electronic" 4-6 titres, 5."🌍 Connexions inattendues" 3-5 titres. Minimum 35 titres.`;

  try{
    const res=await fetch('https://api.groq.com/openai/v1/chat/completions',{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':`Bearer ${key}`},
      body:JSON.stringify({model:'llama-3.3-70b-versatile',max_tokens:4096,messages:[{role:'user',content:prompt}]})
    });
    const data=await res.json();
    if(!data.choices?.[0])throw new Error(data.error?.message||'Réponse invalide');
    let raw=data.choices[0].message.content.trim().replace(/```json|```/g,'').trim();
    const s=raw.indexOf('{'),e=raw.lastIndexOf('}');
    if(s===-1||e===-1)throw new Error('JSON invalide');
    const parsed=JSON.parse(raw.slice(s,e+1));
    history=history.filter(h=>h.artist.toLowerCase()!==artist.toLowerCase());
    history.push({artist:parsed.artist||artist,genre});
    if(history.length>20)history.shift();
    localStorage.setItem('bmd_h',JSON.stringify(history));
    render(parsed);
  }catch(err){showError('Erreur — '+err.message);document.getElementById('emptyState').style.display='';}
  finally{setLoading(false);document.getElementById('searchBtn').disabled=false;}
}

document.getElementById('searchInput').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();go();}});
</script>
</body>
